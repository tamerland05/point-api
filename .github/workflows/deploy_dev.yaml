name: Deploy dev

on:
  push:
    branches: [ dev ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_ENV: dev

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Log in to the Container registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          file: ./point-core/Dockerfile
          no-cache: 'true'
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    runs-on: ubuntu-latest
    environment: dev
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.DEV_VPS_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_VPS_HOST }} > ~/.ssh/known_hosts
          docker context create remote --docker host=ssh://${{ secrets.DEV_VPS_USER }}@${{ secrets.DEV_VPS_HOST }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3.0.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Creating .env for docker-compose.dev.yaml
        run: |
          cat > .env << EOF
          AWS_SERVICE_NAME=${{ vars.AWS_SERVICE_NAME }}
          AWS_ENDPOINT_URL=${{ vars.AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_BUCKET_NAME=${{ vars.AWS_BUCKET_NAME }}
          
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          POSTGRES_HOST=${{ secrets. POSTGRES_HOST}}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          
          ASSETS_URL=${{ secrets.ASSETS_URL }}
          TON_INDEXER_URL=${{ secrets.TON_INDEXER_URL }}
          TON_INDEXER_API_KEY=${{ secrets.TON_INDEXER_API_KEY }}
          TON_INDEXER_RPS=${{ secrets.TON_INDEXER_RPS }}

          WALLET_ID=${{ secrets.WALLET_ID }}
          SEED=${{ secrets.SEED }}
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          
          FIX_FEE=${{ secrets.FIX_FEE }}
          JETTON_TRANSFER_AMOUNT=${{ secrets.JETTON_TRANSFER_AMOUNT }}
          POINT_WALLET=${{ secrets.POINT_WALLET }}

          BONUS_REWARD_FOR_PREMIUM=${{ vars.BONUS_REWARD_FOR_PREMIUM }}
          BONUS_REWARD_FOR_SIMPLE=${{ vars.BONUS_REWARD_FOR_SIMPLE }}
          BONUS_REWARD_FOR_RATING=${{ vars.BONUS_REWARD_FOR_RATING }}
          
          LOGO_HASH=${{ vars.LOGO_HASH }}
          SET_RATING_AMOUNT=${{ vars.SET_RATING_AMOUNT }}

          POINT_APP_URL=${{ vars.POINT_APP_URL }}
          POINT_BOT_NAME=${{ vars.POINT_BOT_NAME }}
          POINT_CHANNEL_NAME=${{ vars.POINT_CHANNEL_URL }}
          BOT_TOKEN=${{ secrets.BOT_TOKEN }}
          JWT_ALGORITHM=${{ secrets.JWT_ALGORITHM }}
          PUBLIC_KEY=${{ secrets.PUBLIC_KEY }}
          
          ADMIN_AUTH_KEY=${{ secrets.ADMIN_AUTH_KEY }}
          
          APP_ENV=dev

          EOF

      - name: Docker compose
        env:
          IMAGE_REF: ${{ steps.meta.outputs.tags }}
        run: |
          docker -c remote compose -f docker-compose.dev.yaml up -d --pull always

      - name: Remove old images
        run: |
          docker -c remote image prune -f

      - name: cleanup
        run: rm -rf ~/.ssh
