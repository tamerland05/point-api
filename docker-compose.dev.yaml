---
services:
  postgres:
    restart: always
    image: postgis/postgis:16-3.4
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 3s
      retries: 3
    env_file:
      - ./.env
    volumes:
      - ./db:/var/lib/postgresql/data

  migration:
    image: ${IMAGE_REF}
    depends_on:
      postgres:
        condition: service_healthy
    command: aerich upgrade
    environment:
      PYTHONPATH: src
    env_file:
      - ./.env

  api:
    image: ${IMAGE_REF}
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
    command: python -m uvicorn point.app:app --host 0.0.0.0 --port 8000
    restart: always
    environment:
      PYTHONPATH: src
    env_file:
      - ./.env
