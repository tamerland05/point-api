[project]
name = "point-api"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "aerich>=0.9.0",
    "aiobotocore>=2.22.0",
    "asyncpg>=0.30.0",
    "cryptography>=45.0.4",
    "faker>=37.4.0",
    "fastapi>=0.115.12",
    "fastapi-pagination>=0.13.2",
    "notebook>=7.4.3",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.9.1",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "pytoniq>=0.1.41",
    "tomlkit>=0.13.3",
    "tonsdk>=1.0.15",
    "tortoise-orm>=0.25.1",
    "uvicorn>=0.34.3",
]

[tool.aerich]
tortoise_orm = "point.config.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
